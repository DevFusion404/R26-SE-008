# ============================================================
# nginx config for Vite / React SPA
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------
    # Client-side routing support
    #
    # React Router handles /dashboard, /project/:id, etc. in
    # the browser. nginx must serve index.html for every path
    # that is NOT a real file so React Router can take over.
    # Without this, refreshing any route returns 404.
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # Static asset caching
    #
    # Vite fingerprints JS/CSS filenames (e.g. main-Abc123.js)
    # so it is safe to cache them for a long time.
    # ----------------------------------------------------------
    location ~* \.(js|css|png|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------
    # Health check endpoint
    # Azure uses this to verify the container is alive.
    # ----------------------------------------------------------
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ----------------------------------------------------------
    # Security headers
    # ----------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text responses to reduce bandwidth
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
