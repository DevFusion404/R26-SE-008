[pytest]
# CUQA Agent — pytest configuration
# ============================================================

testpaths = tests

# Custom markers
markers =
    unit:        Unit tests for individual components
    api:         FastAPI endpoint tests using TestClient
    integration: End-to-end workflow tests
    security:    Security and path-traversal tests
    performance: Performance and scaling tests (may be slow)
    regression:  Regression tests for known fixed bugs
    edge_case:   Edge cases, boundary values, and failure modes

# Output options
addopts =
    -ra
    --strict-markers
    --tb=short

# Minimum version
minversion = 7.0
