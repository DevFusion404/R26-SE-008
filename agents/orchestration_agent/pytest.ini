[pytest]
# DIWO Orchestration Agent — pytest configuration
# ============================================================
# R26-SE-008 | Bandara S M Y M | IT22277886

testpaths = tests

# Custom markers
markers =
    unit:        Unit tests for individual domain/service components
    api:         Flask endpoint tests using the test client
    integration: End-to-end workflow and cross-agent contract tests
    security:    Path traversal, injection and resource-exhaustion tests
    performance: Performance and scaling tests (may be slow)
    regression:  Regression tests for defects already found and fixed
    edge_case:   Edge cases, boundary values, and failure modes

# Output options
addopts =
    -ra
    --strict-markers
    --tb=short

# Minimum version
minversion = 7.0
