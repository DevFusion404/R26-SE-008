name: CI/CD Pipeline

# ---------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'agents/rdp_agent/**'
      - 'agents/cuqa_agent/**'
      - 'agents/transformation_agent/**'
      - 'agents/orchestration_agent/**'
      - 'user_management/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'agents/rdp_agent/**'
      - 'agents/cuqa_agent/**'
      - 'agents/transformation_agent/**'
      - 'agents/orchestration_agent/**'
      - 'user_management/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      force_rdp:
        description: 'Force rebuild RDP agent even if unchanged'
        required: false
        default: 'false'
        type: boolean
      force_cuqa:
        description: 'Force rebuild CUQA agent even if unchanged'
        required: false
        default: 'false'
        type: boolean
      force_sctva:
        description: 'Force rebuild Transformation agent even if unchanged'
        required: false
        default: 'false'
        type: boolean
      force_diwo:
        description: 'Force rebuild Orchestration agent even if unchanged'
        required: false
        default: 'false'
        type: boolean
      force_user_management:
        description: 'Force rebuild User Management service even if unchanged'
        required: false
        default: 'false'
        type: boolean
      force_frontend:
        description: 'Force rebuild Frontend even if unchanged'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

# ---------------------------------------------------------------
# Global env
# ---------------------------------------------------------------
env:
  IMAGE_TAG: ${{ github.sha }}

# ===============================================================
# JOBS
# ===============================================================
jobs:

  # -------------------------------------------------------------
  # 1. Detect which parts actually changed
  # -------------------------------------------------------------
  detect-changes:
    name: Detect changed agents
    runs-on: ubuntu-latest
    outputs:
      rdp:          ${{ steps.filter.outputs.rdp }}
      cuqa:         ${{ steps.filter.outputs.cuqa }}
      sctva:        ${{ steps.filter.outputs.sctva }}
      diwo:            ${{ steps.filter.outputs.diwo }}
      user_management: ${{ steps.filter.outputs.user_management }}
      frontend:        ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rdp:
              - 'agents/rdp_agent/**'
            cuqa:
              - 'agents/cuqa_agent/**'
            sctva:
              - 'agents/transformation_agent/**'
            diwo:
              - 'agents/orchestration_agent/**'
            user_management:
              - 'user_management/**'
            frontend:
              - 'frontend/**'

  # -------------------------------------------------------------
  # 2a. Build & push RDP agent image to ACR
  # On pull_request: built but NOT pushed.
  # On push to main/master: built AND pushed.
  # -------------------------------------------------------------
  build-rdp:
    name: Build and push RDP agent image
    needs: detect-changes
    runs-on: ubuntu-latest
    if: >
      needs.detect-changes.outputs.rdp == 'true' ||
      github.event.inputs.force_rdp == 'true'
    env:
      IMAGE_NAME: rdp-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push RDP Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agents/rdp_agent
          file: ./agents/rdp_agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # -------------------------------------------------------------
  # 2b. Build & push CUQA agent image to ACR
  # -------------------------------------------------------------
  build-cuqa:
    name: Build and push CUQA agent image
    needs: detect-changes
    runs-on: ubuntu-latest
    if: >
      needs.detect-changes.outputs.cuqa == 'true' ||
      github.event.inputs.force_cuqa == 'true'
    env:
      IMAGE_NAME: cuqa-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push CUQA Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agents/cuqa_agent
          file: ./agents/cuqa_agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # -------------------------------------------------------------
  # 2c. Build & push Transformation agent (SCTVA) image to ACR
  # -------------------------------------------------------------
  build-sctva:
    name: Build and push Transformation agent image
    needs: detect-changes
    runs-on: ubuntu-latest
    if: >
      needs.detect-changes.outputs.sctva == 'true' ||
      github.event.inputs.force_sctva == 'true'
    env:
      IMAGE_NAME: sctva-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push SCTVA Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agents/transformation_agent/safe_code_transformation_agent
          file: ./agents/transformation_agent/safe_code_transformation_agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # -------------------------------------------------------------
  # 2d. Build & push Orchestration agent (DIWO) image to ACR
  #
  # Build context is backend/ because that is where app.py and
  # all Python packages live and what the Dockerfile references.
  # -------------------------------------------------------------
  build-diwo:
    name: Build and push Orchestration agent image
    needs: detect-changes
    runs-on: ubuntu-latest
    if: >
      needs.detect-changes.outputs.diwo == 'true' ||
      github.event.inputs.force_diwo == 'true'
    env:
      IMAGE_NAME: diwo-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push DIWO Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agents/orchestration_agent/backend
          file: ./agents/orchestration_agent/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # -------------------------------------------------------------
  # 2f. Build & push User Management image to ACR
  # -------------------------------------------------------------
  build-user-management:
    name: Build and push User Management image
    needs: detect-changes
    runs-on: ubuntu-latest
    if: >
      needs.detect-changes.outputs.user_management == 'true' ||
      github.event.inputs.force_user_management == 'true'
    env:
      IMAGE_NAME: user-management
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push User Management Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./user_management
          file: ./user_management/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # -------------------------------------------------------------
  # 2e. Build & push Frontend image to ACR
  # -------------------------------------------------------------
  build-frontend:
    name: Build and push Frontend image
    needs: detect-changes
    runs-on: ubuntu-latest
    if: >
      needs.detect-changes.outputs.frontend == 'true' ||
      github.event.inputs.force_frontend == 'true'
    env:
      IMAGE_NAME: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # -------------------------------------------------------------
  # 3b. Deploy User Management to Azure Web App (if configured)
  # -------------------------------------------------------------
  deploy-user-management:
    name: Deploy User Management to Azure Web App
    needs: build-user-management
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      IMAGE_NAME: user-management
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_USER_MANAGEMENT }}
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_USER_MANAGEMENT }}
    steps:
      - name: Deploy User Management image to Azure Web App
        if: >
          env.AZURE_WEBAPP_NAME != '' &&
          env.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # -------------------------------------------------------------
  # 3. Deploy Frontend to Azure Web App
  #
  # The frontend is the primary Web App. All backend microservices
  # are pushed to ACR and run on Azure Container Apps / App Service.
  # Skipped on pull_request events.
  # -------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to Azure Web App
    needs: build-frontend
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      IMAGE_NAME: frontend
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_FRONTEND }}
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
    steps:
      - name: Deploy Frontend image to Azure Web App
        if: >
          env.AZURE_WEBAPP_NAME != '' &&
          env.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
